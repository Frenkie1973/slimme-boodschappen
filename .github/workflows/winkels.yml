name: Supermarktlocaties bijwerken

on:
  schedule:
    - cron: "30 3 * * 1"    # elke maandagnacht
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  winkels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ophalen uit OpenStreetMap
        working-directory: sync
        run: node winkels.mjs
      - name: Opslaan in repository
        run: |
          git config user.name "winkels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/winkels.json
          git diff --cached --quiet || (git commit -m "Supermarktlocaties bijgewerkt" && git push)
